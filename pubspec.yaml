name: petitparser_examples
version: 7.1.0

homepage: https://petitparser.github.io
repository: https://github.com/petitparser/dart-petitparser-examples
description: A collection of example parsers, applications, and benchmarks that
  illustrate the PetitParser framework.
topics:
  - grammar
  - parser
  - parser-combinator
  - parsing
  - peg

environment:
  sdk: ^3.14.0
dependencies:
  args: ^2.7.0
  collection: ^1.19.1
  data: ^0.15.2
  meta: ^1.19.0
  more: ^4.8.1
  petitparser: ^7.1.0
  web: ^1.1.2
  xml: ^7.1.0
dev_dependencies:
  build_runner: ^2.16.2
  build_web_compilers: ^4.8.12
  checks: ^0.4.0
  http: ^1.6.0
  lints: ^6.1.0
  test: ^1.33.0

dependency_overrides:
  petitparser:
    git: https://github.com/petitparser/dart-petitparser.git