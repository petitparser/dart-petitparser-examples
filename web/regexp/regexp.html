<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Regular Expression Playground</title>
  <link rel="stylesheet" href="../shared/style.css">
  <style>
    /* Match highlight styles */
    #highlight-container {
      font-family: var(--font-mono);
      font-size: 1.5rem;
      line-height: 1.6;
      border: 1px solid #d1d5db;
      padding: 1.2rem;
      border-radius: 4px;
      background-color: #ffffff;
      white-space: pre-wrap;
      word-break: break-all;
      min-height: 8rem;
    }
    .match-highlight {
      background-color: rgba(14, 95, 142, 0.2);
      border-bottom: 2px solid var(--color-accent);
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .match-highlight:hover {
      background-color: rgba(14, 95, 142, 0.35);
    }
    .match-highlight.active {
      background-color: rgba(14, 95, 142, 0.5);
      outline: 1px solid var(--color-accent);
    }

    /* AST visualizer styles */
    .ast-node {
      font-family: var(--font-mono);
      margin-left: 2rem;
      position: relative;
    }
    .ast-node::before {
      content: "├─";
      position: absolute;
      left: -1.5rem;
      color: #999;
    }
    .ast-node:last-child::before {
      content: "└─";
    }
    .ast-badge {
      display: inline-block;
      padding: 0.2rem 0.6rem;
      margin: 0.2rem;
      border-radius: 4px;
      font-size: 1.2rem;
      font-weight: bold;
      color: #fff;
    }
    .badge-empty { background-color: #777; }
    .badge-literal { background-color: #0e5f8e; }
    .badge-range { background-color: #159957; }
    .badge-dot { background-color: #e67e22; }
    .badge-anchor { background-color: #d9534f; }
    .badge-quantifier { background-color: #003962; }
    .badge-alternation { background-color: #2980b9; }
    .badge-concatenation { background-color: #34495e; }
    .badge-complement { background-color: #f39c12; }
    .badge-intersection { background-color: #16a085; }

    /* Table styles for NFA */
    .nfa-table-container {
      max-height: 400px;
      overflow-y: auto;
      border: 1px solid var(--color-border);
      border-radius: 4px;
    }
    table.nfa-table {
      margin-bottom: 0;
    }
    table.nfa-table th, table.nfa-table td {
      padding: 0.8rem 1rem;
      font-size: 1.35rem;
    }
    .state-badge {
      font-family: var(--font-mono);
      font-weight: bold;
      padding: 0.2rem 0.5rem;
      border-radius: 3px;
      font-size: 1.25rem;
    }
    .state-badge.normal {
      background-color: #e9ecef;
      color: var(--color-text);
    }
    .state-badge.start {
      background-color: #159957;
      color: white;
    }
    .state-badge.end {
      background-color: #0e5f8e;
      color: white;
    }
    .transition-list {
      font-family: var(--font-mono);
      margin: 0;
      padding: 0;
      list-style: none;
    }
    .transition-item {
      display: inline-block;
      margin-right: 0.8rem;
      background-color: var(--color-code-bg);
      padding: 0.1rem 0.4rem;
      border-radius: 3px;
      border: 1px solid var(--color-code-border);
      cursor: pointer;
      transition: all 0.2s;
    }
    .transition-item:hover {
      background-color: rgba(14, 95, 142, 0.15);
      border-color: var(--color-accent);
    }
    tr.state-row-active {
      background-color: rgba(14, 95, 142, 0.12) !important;
    }
  </style>
</head>
<body>
  <header class="page-header">
    <h1 class="project-name">Regular Expression Playground</h1>
    <h2 class="project-tagline">Parses regex syntax, compiles to Non-deterministic Finite Automata (NFA), and matches interactively.</h2>
    <div class="header-nav">
      <a class="btn-banner" href="/">Website</a>
      <a class="btn-banner" href="https://github.com/petitparser/dart-petitparser-examples/blob/main/lib/regexp.dart" target="_blank" rel="noopener">Source</a>
    </div>
  </header>

  <main class="container">
    <div class="row">
      <div class="column column-50">
        <div class="card">
          <h2>1. Pattern &amp; Input</h2>
          
          <label for="regexp-input">Regular Expression</label>
          <input type="text" id="regexp-input" value="(a|b)*abb" placeholder="e.g. (a|b)*abb" spellcheck="false" autocomplete="off" autofocus>
          
          <label for="test-input">Test String</label>
          <textarea id="test-input" placeholder="Type test string here..." rows="4" spellcheck="false">ababb</textarea>

          <label>Quick Examples</label>
          <div class="button-group">
            <button class="preset-btn example-btn" data-regex="(a|b)*abb" data-test="ababb">ababb</button>
            <button class="preset-btn example-btn" data-regex="\d+" data-test="12345">Digits</button>
            <button class="preset-btn example-btn" data-regex="[a-zA-Z_]\w*" data-test="my_variable_12">Identifiers</button>
            <button class="preset-btn example-btn" data-regex="[a-z]+@[a-z]+\.[a-z]+" data-test="hello@world.com">Simple Email</button>
            <button class="preset-btn example-btn" data-regex="^a*b$" data-test="aaab">Anchored</button>
            <button class="preset-btn example-btn" data-regex="a{2,4}" data-test="aaaaa">Ranges</button>
          </div>
        </div>
      </div>

      <div class="column column-50">
        <div class="card">
          <h2>2. Match Results</h2>
          <div id="error-box" style="display: none;" class="error"></div>
          
          <div id="match-results-box">
            <label>Live Matches</label>
            <div id="highlight-container"></div>
            
            <label style="margin-top: 1.5rem;">Match Details (<span id="match-count">0</span> matches found)</label>
            <div style="max-height: 15rem; overflow-y: auto; border: 1px solid var(--color-border); border-radius: 4px; padding: 0.5rem 1rem; background-color: var(--color-pre-bg);">
              <ul id="match-list" style="margin: 0; padding: 0; list-style: none; font-size: 1.35rem; font-family: var(--font-mono);">
                <!-- Populate dynamically -->
              </ul>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="row">
      <div class="column column-50">
        <div class="card">
          <h2>3. AST Visualization</h2>
          <div style="background-color: var(--color-pre-bg); border: 1px solid var(--color-border); border-radius: 4px; padding: 1.5rem; max-height: 400px; overflow-y: auto;">
            <div id="ast-container"></div>
          </div>
        </div>
      </div>

      <div class="column column-50">
        <div class="card">
          <h2>4. NFA States &amp; Transitions</h2>
          <div class="nfa-table-container">
            <table class="nfa-table">
              <thead>
                <tr>
                  <th style="width: 25%;">State</th>
                  <th>Transitions</th>
                </tr>
              </thead>
              <tbody id="nfa-table-body">
                <!-- Populate dynamically -->
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <footer>
      Built with <a href="/">PetitParser</a>.
    </footer>
  </main>

  <script src="regexp.dart.js"></script>
  <script src="../shared/shared.dart.js"></script>
</body>
</html>
